name: Check GTA 6 PC release

on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC
  workflow_dispatch:          # lets you (or the website's button) start it by hand

permissions:
  contents: write             # so the script can save result.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The saved answer and the device list live on the "data" branch, so saving them
      # never redeploys the website. (Create the branch once, see README.)
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Run the checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional, not needed for website notifications
        run: |
          # first run only: carry over files that used to live on the main branch
          for f in result.json subscriptions.json; do
            if [ ! -f "data/$f" ] && [ -f "$f" ]; then cp "$f" "data/$f"; fi
          done
          python3 check.py --out data/result.json

      # Only when the answer changed: check.py leaves a notify.json behind
      - uses: actions/setup-python@v5
        if: hashFiles('data/notify.json') != ''
        with:
          python-version: "3.12"

      - name: Install the web push library
        if: hashFiles('data/notify.json') != ''
        run: pip install --disable-pip-version-check pywebpush

      - name: Send push notifications
        if: hashFiles('data/notify.json') != ''
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          SUBS_FILE: data/subscriptions.json
          NOTIFY_FILE: data/notify.json
        run: python3 push.py notify

      - name: Save result
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.json
          git add subscriptions.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update result"
            for i in 1 2 3; do git push && break || git pull --rebase; done
          fi
