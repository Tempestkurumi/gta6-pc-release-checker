name: Check GTA 6 PC release

on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC
  workflow_dispatch:          # lets you press "Run workflow" yourself

permissions:
  contents: write             # so the script can save result.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional, for phone notifications
        run: python3 check.py

      - name: Save result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.json
          git diff --cached --quiet || (git commit -m "Update result" && git push)
