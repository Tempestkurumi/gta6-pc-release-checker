name: Push notifications (register / test)

# Started from the website's "Notification settings" page. You normally never press this by hand.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        required: true
        type: choice
        options: [subscribe, unsubscribe, test]
      subscription:
        description: "Device subscription (JSON)"
        required: false
        default: ""
      prefs:
        description: "Which notifications this device wants (JSON)"
        required: false
        default: ""
      label:
        description: "Device name"
        required: false
        default: ""
      endpoint:
        description: "Device address (for test / unsubscribe)"
        required: false
        default: ""
      delay:
        description: "Seconds to wait before a test"
        required: false
        default: "15"

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the web push library
        run: pip install --disable-pip-version-check pywebpush

      - name: Run
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          SUB_JSON: ${{ inputs.subscription }}
          SUB_PREFS: ${{ inputs.prefs }}
          LABEL: ${{ inputs.label }}
          ENDPOINT: ${{ inputs.endpoint }}
          DELAY: ${{ inputs.delay }}
        run: python3 push.py "$ACTION"

      - name: Save the device list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptions.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update devices"
            for i in 1 2 3; do git push && break || git pull --rebase; done
          fi
